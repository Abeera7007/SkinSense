<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">SkinSense AI</title>
  <desc id="d">Cosmetology education and skincare companion Android app</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F1"/>
      <stop offset="0.55" stop-color="#FBE6E6"/>
      <stop offset="1" stop-color="#F6D3D9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>

  <!-- soft decorative orbs -->
  <circle cx="1060" cy="70" r="150" fill="#F4C2CC" opacity="0.45"/>
  <circle cx="1130" cy="290" r="110" fill="#E9D5BE" opacity="0.55"/>
  <circle cx="90" cy="300" r="120" fill="#F6CBD3" opacity="0.5"/>
  <circle cx="230" cy="40" r="60" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="900" cy="170" r="190" fill="url(#glow)"/>

  <!-- emblem: leaf + sparkle inside ring -->
  <g transform="translate(150 170)">
    <circle r="82" fill="#FFF8F1" stroke="#D98FA0" stroke-width="3"/>
    <circle r="68" fill="none" stroke="#E9D5BE" stroke-width="2" stroke-dasharray="3 7"/>
    <path d="M-30 28 C-42 -18 -8 -52 34 -46 C40 -4 14 34 -30 28 Z" fill="#E8A9B6"/>
    <path d="M-30 28 C-14 4 4 -14 26 -34" fill="none" stroke="#FFF8F1" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 -52 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" fill="#B76E79"/>
  </g>

  <!-- wordmark -->
  <text x="280" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#4A3428" letter-spacing="1">SkinSense <tspan font-style="italic" fill="#C9788A">AI</tspan></text>
  <line x1="284" y1="190" x2="560" y2="190" stroke="#D98FA0" stroke-width="3" stroke-linecap="round"/>
